name: Auto-Sync Deleted Articles

on:
  push:
    branches:
      - main
    paths:
      - 'articles/**'
      - 'data/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-and-cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Configure Git Committer
        run: |
          git config --global user.name "GenAlpha Auto-Sync"
          git config --global user.email "bot@genalphamagazines.com"

      - name: Run Article Sync Engine
        run: node scripts/sync_articles.js

      - name: Commit and Push Purged References
        run: |
          git add -A
          if git diff --staged --quiet; then
            echo "✅ All articles and feeds are already in sync. No deleted references found."
          else
            git commit -m "🧹 Auto-sync: Purged deleted article references from homepage & categories [skip ci]"
            SUCCESS=0
            for attempt in 1 2 3 4 5; do
              echo "Push attempt $attempt of 5..."
              if git push origin main; then
                SUCCESS=1
                echo "✅ Successfully synced and updated live website."
                break
              fi
              echo "Push rejected by concurrent update. Pulling and rebasing..."
              git fetch origin main
              git rebase -X ours origin/main || (git rebase --abort && git merge -X ours origin/main -m "Merge remote-tracking branch 'origin/main'")
              sleep 5
            done
            if [ $SUCCESS -ne 1 ]; then
              echo "❌ Git push failed after 5 attempts."
              exit 1
            fi
          fi
