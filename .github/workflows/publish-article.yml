name: Automated Article Publishing Pipeline (Gemini AI + Google Drive)

on:
  schedule:
    - cron: '0 14 * * *'  # 1 article/day at 14:00 UTC (safe sustainable velocity)
  workflow_dispatch:
    inputs:
      topic:
        description: 'Optional custom topic (leave blank for auto-selection from keyword pool)'
        required: false
        default: ''
      category:
        description: 'Target Category (leave blank for automatic rotation)'
        required: false
        default: ''
        type: choice
        options:
          - ''
          - news
          - celebrity
          - entertainment
          - games
          - technology
          - others

permissions:
  contents: write
  pull-requests: write

jobs:
  generate-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull latest changes (before generating content)
        run: git pull --rebase origin main

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Dependencies
        run: npm install --no-audit --prefer-offline || npm install --no-audit

      - name: Ensure data directory exists
        run: mkdir -p data assets/images

      - name: Configure Git Committer
        run: |
          git config --global user.name "TechPulse Publishing Engine"
          git config --global user.email "bot@techpulse-publisher.vercel.app"

      - name: Run Gemini AI Content Engine
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEYS || secrets.GEMINI_API_KEY }}
          GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS || secrets.GEMINI_API_KEY }}
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
          GCP_CREDENTIALS_JSON: ${{ secrets.GCP_CREDENTIALS_JSON }}
          INDEXING_CREDENTIALS_JSON: ${{ secrets.INDEXING_CREDENTIALS_JSON || secrets.GCP_CREDENTIALS_JSON }}
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          GCP_REGION: ${{ secrets.GCP_REGION || 'us-central1' }}
          GOOGLE_DRIVE_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_FOLDER_ID }}
          GOOGLE_SHEET_ID: '1Xmp_RAZxjsDdEda8R6GlY53A8EyUk9TV'
          GOOGLE_SHEET_GID: '279315221'
        run: |
          node scripts/sync_articles.js
          node scripts/publisher.js \
            --topic "${{ github.event.inputs.topic || '' }}" \
            --category "${{ github.event.inputs.category || '' }}"

      - name: Enforce Standards & Sync Feeds
        run: |
          node scripts/enforce_faq_format.js
          node scripts/sync_articles.js

      - name: Commit and Push New Article & Updated Feeds
        run: |
          git add -A
          if git diff --staged --quiet; then
            echo "✅ No new article generated (topic pool may be exhausted or skipped). No commit needed."
          else
            git commit -m "🤖 Auto-published: New SEO article via Gemini AI"
            # Push with retry and merge conflict resolution
            SUCCESS=0
            for attempt in 1 2 3 4 5; do
              echo "Push attempt $attempt of 5..."
              if git push origin main; then
                SUCCESS=1
                echo "✅ Article successfully published and pushed to GitHub."
                break
              fi
              echo "Push rejected by concurrent update. Pulling and rebasing..."
              git fetch origin main
              git rebase -X ours origin/main || (git rebase --abort && git merge -X ours origin/main -m "Merge remote-tracking branch 'origin/main'")
              node scripts/sync_articles.js
              git add -A
              git commit --amend --no-edit || true
              sleep 5
            done
            if [ $SUCCESS -ne 1 ]; then
              echo "❌ Git push failed after 5 attempts."
              exit 1
            fi
          fi