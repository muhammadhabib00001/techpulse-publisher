name: Automated Article Publishing Pipeline (Gemini AI + Google Drive)

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      topic:
        description: 'Optional custom topic (leave blank for auto-selection from keyword pool)'
        required: false
        default: ''
      category:
        description: 'Target Category (leave blank for automatic rotation)'
        required: false
        default: ''
        type: choice
        options:
          - ''
          - news
          - business
          - celebrity
          - entertainment
          - games
          - health
          - technology
          - others

permissions:
  contents: write
  pull-requests: write

jobs:
  generate-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull latest changes (before generating content)
        run: git pull --rebase origin main

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Dependencies
        run: npm install --no-audit --prefer-offline || npm install --no-audit

      - name: Ensure data directory exists
        run: mkdir -p data assets/images

      - name: Configure Git Committer
        run: |
          git config --global user.name "TechPulse Publishing Engine"
          git config --global user.email "bot@techpulse-publisher.vercel.app"

      - name: Run Gemini AI Content Engine
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
          GCP_CREDENTIALS_JSON: ${{ secrets.GCP_CREDENTIALS_JSON }}
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          GCP_REGION: ${{ secrets.GCP_REGION || 'us-central1' }}
          GOOGLE_DRIVE_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_FOLDER_ID }}
        run: |
          node scripts/publisher.js \
            --topic "${{ github.event.inputs.topic || '' }}" \
            --category "${{ github.event.inputs.category || '' }}"

      - name: Commit and Push New Article & Updated Feeds
        run: |
          git add -A
          if git diff --staged --quiet; then
            echo "✅ No new article generated (topic pool may be exhausted or skipped). No commit needed."
          else
            git commit -m "🤖 Auto-published: New SEO article via Gemini AI [skip ci]"
            # Push with retry: if rejected by a concurrent run, rebase and retry once
            if ! git push origin main; then
              echo "⚠️ Push rejected (concurrent run). Rebasing and retrying..."
              git pull --rebase origin main
              git push origin main
              echo "✅ Retry push succeeded."
            else
              echo "✅ Article successfully published and pushed to GitHub."
            fi
          fi