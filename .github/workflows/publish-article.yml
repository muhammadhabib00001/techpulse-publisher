name: Automated Article Publishing Pipeline (Gemini AI + Google Drive)

on:
  schedule:
    # Runs every Tuesday and Friday at 08:00 UTC
    - cron: '0 8 * * 2,5'
  workflow_dispatch:
    inputs:
      topic:
        description: 'Optional custom topic (leave blank to pull from Google Drive brief or default pool)'
        required: false
        default: ''
      category:
        description: 'Target Category (news, community, business, arts, lifestyle, voices)'
        required: false
        default: 'news'
        type: choice
        options:
          - news
          - community
          - business
          - arts
          - lifestyle
          - voices

permissions:
  contents: write
  pull-requests: write

jobs:
  generate-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Dependencies
        run: npm install

      - name: Run Gemini / Vertex AI Content Engine
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY || 'rug2wxB71o1mh5kYy_K6kJVLxXZ6CA2apSHUrGqZYLk' }}
          GCP_CREDENTIALS_JSON: ${{ secrets.GCP_CREDENTIALS_JSON }}
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          GCP_REGION: ${{ secrets.GCP_REGION || 'us-central1' }}
          GOOGLE_DRIVE_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_FOLDER_ID }}
        run: |
          node scripts/publisher.js \
            --topic "${{ github.event.inputs.topic || '' }}" \
            --category "${{ github.event.inputs.category || 'news' }}"

      - name: Configure Git Committer
        run: |
          git config --global user.name "GenAlphaMagazines Publishing Engine"
          git config --global user.email "bot@genalphamagazines.com"

      - name: Commit and Push New Article & Updated Feeds
        run: |
          git add articles/ assets/images/ index.html category-*.html categories.html sitemap.xml
          if git diff --staged --quiet; then
            echo "No changes to commit. Article generation might have been skipped."
          else
            git commit -m "Automated publication: New in-depth community journalism feature [skip ci]"
            git pull --rebase origin main
            git push origin main
          fi