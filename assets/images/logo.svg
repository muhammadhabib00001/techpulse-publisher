<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 120" width="100%" height="100%">
  <defs>
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d62828" />
      <stop offset="100%" stop-color="#9e0e18" />
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Red Badge Icon -->
  <rect x="10" y="15" width="110" height="90" rx="12" fill="url(#badgeGrad)" filter="url(#dropShadow)" />
  
  <!-- Stylized Geometric 'GA' Monogram inside Badge -->
  <path d="M 40 75 L 65 35 L 90 75 M 50 63 L 80 63" stroke="#ffffff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  <circle cx="65" cy="48" r="4" fill="#f59e0b" />

  <!-- Typography: GenAlpha -->
  <text x="140" y="66" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="900" fill="#111418" letter-spacing="-1">
    GEN<tspan fill="#c1121e">ALPHA</tspan>
  </text>
  
  <!-- Typography: MAGAZINES -->
  <text x="362" y="66" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="300" fill="#495057" letter-spacing="1">
    MAGAZINES
  </text>

  <!-- Tagline Rule & Subtitle -->
  <rect x="142" y="80" width="370" height="3" fill="#c1121e" rx="1.5" />
  <text x="144" y="98" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13.5" font-weight="600" fill="#6c757d" letter-spacing="0.5">
    POSITIVELY LOCAL &bull; SUPPORTING COMMUNITY &bull; EST. 2026
  </text>
</svg>