<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <radialGradient id="favLogo_bg" cx="50%" cy="32%" r="68%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="55%" stop-color="#dc2626" />
      <stop offset="100%" stop-color="#7f1d1d" />
    </radialGradient>
    <linearGradient id="favLogo_gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <linearGradient id="favLogo_silver" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="60%" stop-color="#f1f5f9" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>
    <filter id="favLogo_glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Shield / Hex Ring -->
  <rect x="6" y="6" width="88" height="88" rx="22" fill="url(#favLogo_gold)" />
  <rect x="9" y="9" width="82" height="82" rx="19" fill="#0f172a" />
  <rect x="11" y="11" width="78" height="78" rx="17" fill="url(#favLogo_bg)" />
  
  <!-- Subtle High-tech Grid / Glass Highlight -->
  <path d="M 11 28 Q 50 12 89 28 L 89 11 L 11 11 Z" fill="#ffffff" opacity="0.12" />

  <!-- Stylized Alpha Emblem 'α' + Crest -->
  <g transform="translate(0, 1)">
    <!-- Back Wing / G Loop -->
    <path d="M 50 22 C 34 22 24 34 24 50 C 24 66 35 76 50 76 C 64 76 74 66 74 52 C 74 42 67 36 58 36 C 50 36 44 42 44 50 C 44 57 49 61 56 61 L 56 52 L 64 52" 
          fill="none" stroke="url(#favLogo_gold)" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Core Dynamic Alpha Swash -->
    <path d="M 32 68 Q 50 24 68 68" 
          fill="none" stroke="url(#favLogo_silver)" stroke-width="7" stroke-linecap="round" filter="url(#favLogo_glow)" />

    <!-- Center Crest Star Emblem -->
    <polygon points="50,27 53,35 61,35 55,40 57,48 50,43 43,48 45,40 39,35 47,35" fill="url(#favLogo_gold)" />
  </g>
</svg>